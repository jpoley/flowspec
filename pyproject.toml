[project]
name = "flowspec-cli"

version = "0.4.008"



description = "Flowspec - A layered extension of GitHub Spec Kit with multi-language support and advanced agent orchestration for Spec-Driven Development (SDD)."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
    "pyyaml>=6.0",
    "keyring>=25.0.0",
    "jsonschema>=4.0.0",
    # Pinned below 2.0: FastMCP 2.x no longer exposes @mcp.tool()-decorated
    # functions as plain module attributes, which breaks flowspec_cli.security.mcp_server.
    "mcp>=1.26.0,<2",
]

[project.scripts]
flowspec = "flowspec_cli:main"
# `specify` is a legacy alias for flowspec CLI - NOT related to /flow:specify command
specify = "flowspec_cli:main"

[project.entry-points.pytest11]
flowspec_ac = "flowspec_cli.pytest_plugin"

[build-system]
# Pinned: an unbounded backend silently changes build behaviour between runs
# (hatchling 1.32 started rejecting duplicate wheel entries).
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec_cli"]

# NOTE: Do NOT add a `[tool.hatch.build.targets.wheel.force-include]` entry for
# `src/flowspec_cli/templates`. That path is already inside the `packages` entry
# above, so force-including it makes hatchling add every template twice and the
# wheel build fails with "A second file is being added to the wheel archive".

[project.optional-dependencies]
dast = [
    "playwright>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    # Pinned below 0.15: ruff 0.16 formats Markdown code blocks, which would
    # reformat 213 files under docs/ and user-docs/. Adopt deliberately, not by drift.
    "ruff>=0.14.14,<0.15",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "git_sync: marks tests that require git sync operations (skip in CI with '-m \"not git_sync\"')",
]

