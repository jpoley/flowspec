project_name: "flowspec"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["Format check passes: uv run ruff format --check .", "Lint passes: uv run ruff check .", "Tests pass: uv run pytest tests/ -x -q", "All acceptance criteria checked", "Implementation notes written in the task", "PR created and CI green"]
milestones: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
